# Publishes the phone dashboard (dashboard/) to GitHub Pages.
#
# The dashboard is a static, build-free site, so there is nothing to compile — the workflow just
# uploads the dashboard/ folder as the Pages artifact and deploys it. It runs on a push to the
# default branch that touched dashboard/, and can be run by hand from any branch (Actions tab →
# "Deploy dashboard to Pages" → Run workflow) so you can preview a branch before merging.
#
# Turn Pages on once, in the repo: Settings → Pages → Build and deployment → Source =
# "GitHub Actions", and set the custom domain emcool.athegen.com (dashboard/CNAME). See docs/hosting.md.

name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

# Let the deploy read the repo and mint a Pages deployment token; nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; a newer push supersedes an in-flight one rather than queueing.
concurrency:
  group: pages
  cancel-in-progress: true

# Upload and deploy run in separate jobs. deploy-pages looks the artifact up once, with no retry,
# and GitHub's artifact listing can lag the upload by a moment, so a deploy in the same job as the
# upload sometimes fails with 'No artifacts named "github-pages"'. Starting a second job gives the
# listing time to catch up.
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: Upload the dashboard as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard

  deploy:
    needs: upload
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
